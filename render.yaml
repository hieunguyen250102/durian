# Render Blueprint: realtime game server (Socket.IO).
services:
  - type: web
    name: durian-server
    runtime: node
    plan: free
    buildCommand: npm install --prefix server && npm run build --prefix server
    startCommand: node server/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Your Vercel URL(s), comma-separated, e.g. https://durian.vercel.app. Leave empty to allow any origin.
      - key: CLIENT_ORIGIN
        sync: false
      - key: NODE_ENV
        value: production
      # Signs login tokens; keep it stable or everyone is logged out.
      - key: SESSION_SECRET
        generateValue: true
      # Shared mail relay (oink-kit's oink-mail on Vercel), e.g. https://oink-mail.vercel.app/api/send-code
      - key: MAIL_RELAY_URL
        sync: false
      - key: MAIL_RELAY_SECRET
        sync: false
      # Emails allowed to create rooms, comma-separated. Empty = anyone who logs in.
      - key: HOST_EMAILS
        sync: false
